# fly.toml app configuration file for Fly.io deployment
app = "smartquotehub"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  TRUSTEDFORM_API_KEY = "YOUR_TRUSTEDFORM_API_KEY"
  TURSO_DATABASE_URL = "libsql://YOUR_TURSO_DATABASE_HOST"
  TURSO_AUTH_TOKEN = "YOUR_TURSO_AUTH_TOKEN"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop_process"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
