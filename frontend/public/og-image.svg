<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle glow patterns -->
  <circle cx="200" cy="150" r="300" fill="#2563EB" opacity="0.12" filter="blur(80px)" />
  <circle cx="1000" cy="450" r="280" fill="#10B981" opacity="0.10" filter="blur(80px)" />

  <!-- Logo Icon Badge -->
  <g transform="translate(100, 100)">
    <rect width="84" height="84" rx="20" fill="#1E293B" stroke="#334155" stroke-width="2" />
    <path d="M42 16 L66 26 C66 44 56 60 42 68 C28 60 18 44 18 26 Z" fill="url(#brandGrad)" />
    <path d="M34 40 L40 46 L52 32" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Logo Text -->
  <text x="210" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
    Smart<tspan fill="#3B82F6">Quote</tspan>Hub
  </text>

  <!-- Main Headline -->
  <text x="100" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1">
    Compare Plans. Save Smart.
  </text>
  <text x="100" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="700" fill="url(#brandGrad)">
    Get Free Quotes Nationwide.
  </text>

  <!-- Subheadline -->
  <text x="100" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400" fill="#94A3B8">
    Compare Health Insurance, Medicare, Auto, Home Services, Debt Relief &amp; Flights in 60s.
  </text>

  <!-- Feature Pill Tags -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="30" y="33" font-family="sans-serif" font-size="18" font-weight="600" fill="#10B981">✓ 100% Free Service</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="230" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="268" y="33" font-family="sans-serif" font-size="18" font-weight="600" fill="#60A5FA">★ Top-Rated Providers</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="240" height="52" rx="26" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <text x="518" y="33" font-family="sans-serif" font-size="18" font-weight="600" fill="#F59E0B">🔒 256-Bit SSL Secure</text>
  </g>
</svg>
